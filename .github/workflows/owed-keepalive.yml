# Keeps the Owed app (Render free tier) awake so its hourly reminder job runs.
# Public repo => GitHub Actions minutes are free. Remove when the app moves to a paid plan.
name: owed-keepalive
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 120 https://owed-app.onrender.com/healthz
